name: a8n

services:
  db-local:
    image: postgres:16-alpine
    container_name: a8n-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: a8n_dev
      POSTGRES_PASSWORD: a8n_dev
      POSTGRES_DB: a8n_dev
    ports:
      - "5432:5432"
    volumes:
      - a8n_postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a8n_dev -d a8n_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-test:
    image: postgres:16-alpine
    container_name: a8n-postgres-test
    profiles:
      - test
    restart: unless-stopped
    environment:
      POSTGRES_USER: a8n_test
      POSTGRES_PASSWORD: a8n_test
      POSTGRES_DB: a8n_test
    ports:
      - "5433:5432"
    volumes:
      - a8n_postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a8n_test -d a8n_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - dev
    env_file:
      - docker/env/app.development.env
    depends_on:
      db-local:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - a8n_app_node_modules:/app/node_modules
      - a8n_app_next:/app/.next
    command: >
      sh -c "pnpm exec prisma generate &&
             pnpm exec prisma migrate deploy &&
             pnpm dev --hostname 0.0.0.0"

  app-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - test
    env_file:
      - docker/env/app.test.env
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - .:/app
      - a8n_test_node_modules:/app/node_modules
      - a8n_test_next:/app/.next
    command: >
      sh -c "pnpm exec prisma generate &&
             pnpm exec prisma migrate deploy &&
             pnpm env:check -- --profile test &&
             pnpm typecheck"

volumes:
  a8n_postgres_local:
  a8n_postgres_test:
  a8n_app_node_modules:
  a8n_app_next:
  a8n_test_node_modules:
  a8n_test_next:

