packages:
  - .

onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma
  - inngest-cli

overrides:
  # typescript-eslint reads enum objects (ts.Extension, ts.ModuleKind) that the
  # TypeScript 7 JS API no longer exposes, so ESLint crashes on load before
  # linting a single file. No released typescript-eslint supports TS 7 (8.70's
  # peer range is still <6.1.0), so the linter gets its own TypeScript while
  # the app keeps 7.x for tsc and the build.
  "@typescript-eslint/typescript-estree>typescript": "5.9.3"
  "@typescript-eslint/parser>typescript": "5.9.3"
  "@typescript-eslint/project-service>typescript": "5.9.3"
  "@typescript-eslint/tsconfig-utils>typescript": "5.9.3"
  "@typescript-eslint/utils>typescript": "5.9.3"
  "@grpc/grpc-js@>=1.14.0 <1.14.4": 1.14.4
  "@opentelemetry/auto-instrumentations-node@<0.75.0": 0.75.0
  "@opentelemetry/exporter-prometheus@<0.217.0": 0.217.0
  "@opentelemetry/sdk-node@<0.217.0": 0.217.0
  "better-auth@>=1.6.0 <1.6.11": 1.6.11
  "defu@<=6.1.4": 6.1.5
  "fast-uri@<=3.1.1": 3.1.2
  "flatted@<3.4.2": 3.4.2
  "hono@<4.12.25": 4.12.25
  "inngest@>=3.22.0 <3.54.0": 3.54.0
  "kysely@>=0.26.0 <0.28.17": 0.28.17
  "minimatch@<3.1.4": 3.1.4
  "minimatch@>=9.0.0 <9.0.7": 9.0.7
  "next@>=16.0.0 <16.2.6": 16.2.6
  "picomatch@<2.3.2": 2.3.2
  "picomatch@>=4.0.0 <4.0.4": 4.0.4
  "protobufjs@<7.6.1": 7.6.1
  "protobufjs@>=8.0.0 <=8.4.0": 8.4.1
  "ws@>=8.0.0 <8.21.0": 8.21.0
