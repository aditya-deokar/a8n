name: Observability Readiness

on:
  pull_request:
    paths:
      - "src/lib/observability.ts"
      - "src/instrumentation.ts"
      - "scripts/observability-check.ts"
      - "docs/DevOps/observability-runbook.md"
      - "docs/DevOps/alert-rules.md"
      - "docs/DevOps/production-release-runbook.md"
      - ".github/workflows/observability.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
      - "codex/**"
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability-readiness:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: test
      A8N_ENV_PROFILE: test
      DATABASE_URL: postgresql://a8n_test:a8n_test@127.0.0.1:5432/a8n_test
      BETTER_AUTH_SECRET: test-better-auth-secret-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      ENCRYPTION_KEY: test-observability-encryption-key-32
      MCP_API_KEY_HMAC_SECRET: ci-mcp-api-key-hmac-secret-32-chars
      MCP_OAUTH_TOKEN_HMAC_SECRET: ci-mcp-oauth-token-hmac-secret-32
      OBSERVABILITY_LOG_ENABLED: "true"
      OBSERVABILITY_LOG_LEVEL: info
      OBSERVABILITY_PROVIDER: console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Observability check
        run: pnpm observability:check -- --profile test --json

      - name: Upload observability evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: observability-readiness
          path: docs/api/evidence/observability
