name: MCP Quality

on:
  pull_request:
    paths:
      - "src/mcp/**"
      - "src/app/api/mcp/**"
      - "src/app/api/oauth/**"
      - "src/app/api/webhooks/**"
      - "src/env.ts"
      - "prisma/**"
      - "scripts/mcp-*.ts"
      - "scripts/env-check.ts"
      - "scripts/migration-preflight.ts"
      - "docs/mcp/**"
      - "docs/DevOps/**"
      - "tests/mcp/**"
      - "tests/e2e/mcp/**"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.mjs"
      - "playwright.config.mjs"
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-quality:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: test
      A8N_ENV_PROFILE: test
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: postgresql://a8n_test:a8n_test@127.0.0.1:5432/a8n_test
      BETTER_AUTH_SECRET: test-better-auth-secret-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      ENCRYPTION_KEY: test-mcp-encryption-key-32-characters
      POLAR_ACCESS_TOKEN: test-polar-token
      POLAR_SUCCESS_URL: http://127.0.0.1:3000/success
      MCP_AUDIT_DB_ENABLED: "false"
      MCP_AUDIT_LOG_ENABLED: "false"
      MCP_API_KEY_HMAC_SECRET: "ci-mcp-api-key-hmac-secret-32-chars"
      MCP_OAUTH_TOKEN_HMAC_SECRET: "ci-mcp-oauth-token-hmac-secret-32"
      APP_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_WEBHOOK_BASE_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Environment check
        run: pnpm env:check

      - name: Prisma validate
        run: pnpm exec prisma validate

      - name: Database migration preflight
        run: pnpm db:migration:preflight -- --json

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: MCP offline evals
        run: pnpm test:mcp:offline

      - name: MCP contract check
        run: pnpm mcp:contract:check

      - name: MCP unit tests
        run: pnpm test:mcp

      - name: Upload migration evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-migration-preflight
          path: docs/api/evidence/migrations
