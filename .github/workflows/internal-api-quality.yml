name: Internal API Quality

on:
  pull_request:
    paths:
      - "src/trpc/**"
      - "src/app/api/trpc/**"
      - "src/features/**/server/**"
      - "src/lib/auth.ts"
      - "src/lib/db.ts"
      - "src/lib/encryption.ts"
      - "src/lib/polar.ts"
      - "src/inngest/**"
      - "prisma/**"
      - "tests/api/**"
      - "scripts/api-*.ts"
      - "docs/TRPC_INTERNAL_API_TESTING_PLAN.md"
      - "docs/api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.api.config.mjs"
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  api-static:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: postgresql://a8n_test:a8n_test@127.0.0.1:5432/a8n_test
      BETTER_AUTH_SECRET: test-better-auth-secret-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      ENCRYPTION_KEY: test-api-encryption-key-32-characters
      POLAR_ACCESS_TOKEN: test-polar-token
      MCP_API_KEY_HMAC_SECRET: ci-mcp-api-key-hmac-secret-32
      MCP_OAUTH_TOKEN_HMAC_SECRET: ci-mcp-oauth-token-hmac-secret-32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm exec prisma validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: API unit and contract tests
        run: pnpm test:api:unit

  api-integration:
    runs-on: ubuntu-latest
    needs: api-static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: a8n_test
          POSTGRES_PASSWORD: a8n_test
          POSTGRES_DB: a8n_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NODE_ENV: test
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: postgresql://a8n_test:a8n_test@127.0.0.1:5432/a8n_test
      BETTER_AUTH_SECRET: test-better-auth-secret-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      ENCRYPTION_KEY: test-api-encryption-key-32-characters
      POLAR_ACCESS_TOKEN: test-polar-token
      MCP_API_KEY_HMAC_SECRET: ci-mcp-api-key-hmac-secret-32
      MCP_OAUTH_TOKEN_HMAC_SECRET: ci-mcp-oauth-token-hmac-secret-32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: API integration, transport, and security tests
        run: pnpm test:api:integration

      - name: API database integrity tests
        run: pnpm test:api:db
        env:
          API_DATABASE_TESTS: "true"

      - name: API coverage
        run: pnpm test:api:coverage

      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: coverage/api
